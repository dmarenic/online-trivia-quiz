name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Provjera ranjivosti s popisom izričito dokumentiranih iznimaka za
      # ranjivosti koje trenutno nemaju popravak (vidi scripts/audit-check.mjs).
      - run: npm run audit:ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc -p tsconfig.build.json --noEmit
      # ESLint u ovom projektu ima --fix; u CI-u ga pokrećemo bez njega da
      # provjera stvarno padne kad kod nije uredan.
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
